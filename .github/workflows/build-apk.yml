name: Build fasterTunnel Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: |
          cd frontend/android
          chmod +x gradlew || true

      - name: Generate Gradle Wrapper if Missing
        run: |
          cd frontend/android
          gradle wrapper || true

      - name: Build Debug APK
        run: |
          cd frontend/android
          gradle assembleDebug --stacktrace || ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fastertunnel-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
