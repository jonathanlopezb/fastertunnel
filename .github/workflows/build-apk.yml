name: Build fasterTunnel Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test-go:
    name: Test Go backend and gateway agent
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Run Go tests
        run: go test ./...

      - name: Build Linux gateway agent
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags="-s -w" -o fastertunnel-wg-agent ./cmd/wg-agent

      - name: Upload gateway agent
        uses: actions/upload-artifact@v4
        with:
          name: fastertunnel-wg-agent-linux-amd64
          path: fastertunnel-wg-agent
          retention-days: 14

  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Wrapper & Build Debug APK
        run: |
          cd frontend/android
          gradle wrapper --gradle-version 8.10.2 --distribution-type bin
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fastertunnel-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
