# render.yaml — Configuración de Render.com para despliegue automático
# Doc: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: fastertunnel-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: PORT
        value: 8080
      - key: ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY
        value: 24
      - key: DATABASE_URL
        fromDatabase:
          name: fastertunnel-db
          property: connectionString
      - key: WIREGUARD_ENDPOINT
        value: 3.142.187.253:51820
      - key: WIREGUARD_SERVER_PUBLIC_KEY
        value: xxVNhcOpa6Xty5MWtuI/iLDpSs16F5/tjOn7jA0jN2I=
      - key: WIREGUARD_AGENT_TOKEN
        sync: false
    healthCheckPath: /api/v1/health

databases:
  - name: fastertunnel-db
    databaseName: fastertunnel
    user: fastertunnel
    plan: free
